<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | EventPro Supplies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav class="navbar">
    <a class="logo" href="index.html">Event<span>Pro</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Materials</a>
      <a href="services.html">Services</a>
      <a class="active" href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<main class="section contact-section">
  <div>
    <p class="tagline">CONTACT US</p>
    <h1>Let's Plan Your Event</h1>
    <p>Use this form for general enquiries or custom material requirements.</p>
    <div class="contact-info">
      <p><strong>Phone:</strong> +91 98765 43210</p>
      <p><strong>Email:</strong> info@eventprosupply.com</p>
      <p><strong>Location:</strong> Hyderabad, Telangana</p>
    </div>
  </div>

  <form class="contact-form" id="contactForm">
    <input id="name" type="text" placeholder="Your Name" required>
    <input id="phone" type="tel" placeholder="Phone Number" required>
    <input id="email" type="email" placeholder="Email Address">
    <input id="eventType" type="text" placeholder="Event Type" required>
    <input id="eventDate" type="date" required>
    <textarea id="message" rows="6" placeholder="Tell us what you need..." required></textarea>
    <button class="btn" type="submit">Send Enquiry</button>
  </form>
</main>

<footer><p>© 2026 EventPro Supplies. All rights reserved.</p></footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const eventType = document.getElementById("eventType").value.trim();

  if (name.length < 2) {
    alert("Please enter a valid name.");
    return;
  }
  if (!/^[0-9+ -]{10,15}$/.test(phone)) {
    alert("Please enter a valid phone number.");
    return;
  }
  if (!eventType) {
    alert("Please enter your event type.");
    return;
  }

  alert("Thank you! Your enquiry has been recorded on this demo website. Connect a backend or form service to receive submissions.");
  this.reset();
});
</script>
</body>
</html>
